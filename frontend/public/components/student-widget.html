<!-- ═══════════ LanguageStudio Component: Student Widget ═══════════ -->
<button type="button" class="student-widget" title="Student profile" aria-label="Student profile">
  <div class="student-stats">
    <div class="streak-badge">
      <span data-icon="streak"></span>
      <span>1</span>
    </div>
    <div class="xp-badge">
      <span data-icon="xp"></span>
      <span class="xp-val-display">0</span> <span>XP</span>
    </div>
  </div>
  <div class="student-avatar">S</div>
</button>
