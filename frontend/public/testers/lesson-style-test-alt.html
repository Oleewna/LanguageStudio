<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#15234b" />
  <title>Lesson style test B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./lesson-style-test-alt.css" />
  <script src="./lesson-style-test.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="LanguageStudio">
      <span class="brand-mark" aria-hidden="true">LS</span>
      <span>LanguageStudio</span>
    </a>
    <div class="topbar-actions">
      <span class="preview-label" data-copy="previewLabel"></span>
      <a class="back-link" href="../pages/lesson.html?course=it&amp;lesson=communication-basics-1" data-copy="back"></a>
      <button class="language-toggle" id="languageToggle" type="button" aria-label="Switch language">EN</button>
    </div>
  </header>

  <main id="lessonApp" class="lesson-app" aria-live="polite">
    <p class="loading-message" data-copy="loading"></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const labels = { uk: 'ВАРІАНТ B', en: 'STYLE B' };
      const label = document.querySelector('.preview-label');
      const toggle = document.getElementById('languageToggle');
      const updateLabel = () => { label.textContent = labels[document.documentElement.lang] || labels.uk; };
      updateLabel();
      toggle.addEventListener('click', () => requestAnimationFrame(updateLabel));
    });
  </script>
</body>
</html>
