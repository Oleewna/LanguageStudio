<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/png" href="../assets/images/icon.png" />
<title>Тести — LanguageStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800;1,6..12,400..700&display=swap" rel="stylesheet">
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/tests.css">
</head>
<body>
<div data-component="navbar"></div>

<main class="page-container tests-page">
  <section class="assessment-type-grid" aria-label="Типи тестів">
    <article class="assessment-type-card placement-card">
      <div class="assessment-type-icon"><span data-icon="target"></span></div>
      <div class="eyebrow">ПЕРЕД НАВЧАННЯМ</div>
      <h2>Тест на визначення рівня</h2>
      <p>Пройдіть початкове оцінювання, щоб зрозуміти свій поточний рівень і з чого почати.</p>
      <div class="assessment-card-footer">
        <span class="assessment-status"><span data-icon="clock"></span> Незабаром</span>
        <button class="test-action" type="button" disabled><span data-icon="lock"></span> Тест буде доступний пізніше</button>
      </div>
    </article>
  </section>

  <section class="path-assessments-section" id="path-assessments" aria-labelledby="path-assessments-title">
    <div class="tests-section-heading">
      <div>
        <div class="eyebrow">ФІНАЛЬНА ПЕРЕВІРКА</div>
        <h2 id="path-assessments-title">Фінальні тести напрямків</h2>
      </div>
    </div>
    <div class="path-assessment-grid" id="pathAssessmentList" aria-live="polite" aria-busy="true">
      <p class="path-assessment-message" role="status">Завантажуємо напрямки…</p>
    </div>
  </section>
</main>

<div data-component="footer"></div>
<div data-component="profile-modal"></div>

<script src="../js/icons.js"></script>
<script src="../js/components.js"></script>
<script src="../js/course.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/progress-store.js"></script>
<script src="../js/progress.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/app.js"></script>
<script src="../js/path-assessment.js"></script>
<script src="../js/tests.js"></script>
</body>
</html>
