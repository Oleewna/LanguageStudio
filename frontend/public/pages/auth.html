<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg" />
<title data-i18n="pageTitle">Вхід — LanguageStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/studio.css">
</head>
<body class="auth-page">

<!-- ═══════════ AUTH HEADER COMPONENT ═══════════ -->
<div data-component="auth-header"></div>

<!-- ═══════════ MAIN CONTENT ═══════════ -->
<main class="page-container">

  <div class="auth-wrap">
    <div class="auth-card">

      <div class="auth-error-banner" id="auth-global-error" hidden role="alert"></div>

      <div class="auth-panel" id="panel-auth" data-auth-form>
        <h2 class="auth-title" data-i18n="welcomeTitle">Benvenuto!</h2>
        <p class="auth-sub" data-i18n="welcomeSub">Увійдіть за допомогою облікового запису Google, щоб зберігати свій прогрес на всіх пристроях.</p>

        <a href="/api/v1/auth/google" class="btn-google-signin">
          <img src="../assets/icons/google-logo.svg" width="20" height="20" alt="" aria-hidden="true">
          <span data-i18n="googleSignIn">Увійти через Google</span>
        </a>
      </div>

    </div>
  </div>

</main>

<script defer src="../js/icons.js"></script>
<script defer src="../js/components.js"></script>
<script defer src="../js/layout.js"></script>
<script defer src="../js/auth.js"></script>
</body>
</html>
