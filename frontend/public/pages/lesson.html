<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- SEO: title and description updated dynamically by JS -->
  <title>Урок — LanguageStudio</title>
  <meta name="description" content="Інтерактивний урок італійської мови на платформі LanguageStudio. Діалоги, читання, граматика та тести." />
  <meta name="robots" content="index, follow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Theme (must be first to prevent FOUC) -->
  <script src="../js/theme.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/lesson.css" />
</head>
<body>

<!-- ═══════════ NAVBAR COMPONENT ═══════════ -->
<div data-component="navbar"></div>

<!-- ═══════════ LESSON LAYOUT: SIDEBAR + CONTENT ═══════════ -->
<div class="lesson-layout-wrapper">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sbOverlay"></div>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar" aria-label="Зміст уроку">
    <div class="sb-course" id="sbCourseLabel">Курс італійської · Основи</div>
    <div id="sbUnitLessons">
      <!-- Dynamically populated by renderSidebar() -->
    </div>
    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border);">
      <a href="path.html" id="sbAllCoursesLink" style="color:var(--ink-soft);text-decoration:none;font-size:0.82rem;display:flex;align-items:center;gap:0.5rem;">
        <span>
          <svg class="ls-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/>
            <path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5A1.5 1.5 0 0 0 20 18.5z"/>
          </svg>
        </span>
        <span id="sbAllCoursesText">Всі розділи курсу</span>
      </a>
    </div>
  </aside>

  <!-- ── Main content area ── -->
  <div class="lesson-main">

    <!-- Lesson top bar: breadcrumb + nav actions -->
    <div class="lesson-topbar">
      <div style="display:flex;align-items:center;gap:0.6rem;">
        <!-- Mobile sidebar toggle -->
        <button
          class="sb-toggle-btn"
          id="sbToggleBtn"
          type="button"
          aria-label="Зміст розділу"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <svg class="ls-icon" viewBox="0 0 24 24">
            <path d="M12 6.5C10 5 7.3 4.3 4.5 4.3v14c2.8 0 5.5.7 7.5 2.2z" fill="#008c45"/>
            <path d="M12 6.5C14 5 16.7 4.3 19.5 4.3v14c-2.8 0-5.5.7-7.5 2.2z" fill="#d97706"/>
            <line x1="12" y1="6.5" x2="12" y2="20.5" stroke="#172033" stroke-width="1.2"/>
          </svg>
        </button>
        <!-- Breadcrumb -->
        <div class="crumb" id="lessonBreadcrumb" aria-label="Навігація">
          <span id="crumbUnit">Основи спілкування</span>
          &nbsp;›&nbsp;
          <b id="crumbLesson">Урок</b>
        </div>
      </div>
      <div class="lesson-topbar-actions">
        <a href="#" class="btn-ghost" id="btnPrevLesson" aria-label="Попередній урок">← Назад</a>
        <a href="#" class="btn-primary" id="btnNextLesson" aria-label="Наступний урок">Далі →</a>
      </div>
    </div>

    <!-- ── Lesson content: hero + engine body ── -->
    <main class="content" id="lessonMain" aria-live="polite">

      <!-- Hero header (populated dynamically) -->
      <div class="hero" id="lessonHero">
        <div class="hero-copy">
          <div class="hero-label" id="heroLabel"></div>
          <h1 id="heroTitle">Завантаження уроку…</h1>
          <p id="heroDescription"></p>
        </div>
        <div class="hero-meta" id="heroMeta" style="display:flex;flex-direction:column;align-items:flex-end;gap:0.65rem;flex-shrink:0;">
          <!-- Lesson type badge + duration chip rendered by JS -->
        </div>
      </div>

      <!-- Engine-rendered lesson sections mount here -->
      <div id="lessonBody">
        <!-- LessonEngine.renderLesson() injects all section blocks here -->
      </div>

      <!-- Bottom navigation -->
      <nav class="lesson-bottom-nav" id="lessonBottomNav" aria-label="Навігація між уроками">
        <a href="#" class="btn-ghost" id="btnPrevLessonBottom" style="display:none;">← Попередній урок</a>
        <a href="#" class="btn-primary" id="btnNextLessonBottom" style="display:none;">Наступний урок →</a>
      </nav>

    </main>
  </div><!-- /.lesson-main -->
</div><!-- /.lesson-layout-wrapper -->

<!-- ═══════════ SCRIPTS ═══════════ -->
<script src="../js/icons.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/data/lessons.js"></script>
<script src="../js/lesson-engine.js"></script>

<script>
/**
 * lesson.html controller
 * Reads ?id= (or hash #) from URL, looks up LS_LESSONS,
 * renders the sidebar, hero, and all lesson blocks via LessonEngine.
 */
(function () {
  'use strict';

  // ── Helpers ──────────────────────────────────────────────────────────

  /** Build lesson.html URL for a given lesson id */
  function lessonHref(id, courseId) {
    if (!id) return '#';
    const params = new URLSearchParams(window.location.search);
    const activeCourse = courseId || params.get('course') || localStorage.getItem('ls_target_course');
    if (activeCourse && activeCourse !== 'italian') {
      return `lesson.html?course=${encodeURIComponent(activeCourse)}&id=${encodeURIComponent(id)}`;
    }
    return 'lesson.html?id=' + encodeURIComponent(id);
  }

  /** Resolve translated string using LessonEngine.t or resolveLessonTranslation */
  function tr(obj, fallback) {
    if (typeof window.LessonEngine !== 'undefined') {
      return window.LessonEngine.t(obj, fallback || '');
    }
    if (typeof window.resolveLessonTranslation === 'function') {
      const lang = typeof window.getSourceLanguage === 'function' ? window.getSourceLanguage() : 'uk';
      return window.resolveLessonTranslation(obj, lang, fallback || '');
    }
    if (obj && typeof obj === 'object') return obj.uk || obj.en || fallback || '';
    return obj || fallback || '';
  }

  /** Check if lesson is completed */
  function isCompleted(id) {
    if (typeof window.LessonEngine !== 'undefined') return window.LessonEngine.isLessonCompleted(id);
    try {
      const raw = localStorage.getItem('ls_completed_lessons');
      if (!raw) return false;
      const list = JSON.parse(raw);
      return Array.isArray(list) ? list.includes(id) : false;
    } catch (e) { return false; }
  }

  /** Map lesson type to localised badge label */
  function typeBadge(type, lang) {
    const map = {
      dialogue:   { uk: 'Діалог',    en: 'Dialogue', pl: 'Dialog' },
      reading:    { uk: 'Читання',   en: 'Reading',  pl: 'Czytanie' },
      grammar:    { uk: 'Граматика', en: 'Grammar',  pl: 'Gramatyka' },
      checkpoint: { uk: 'Тест',      en: 'Test',     pl: 'Test' },
    };
    const entry = map[type] || map.dialogue;
    return entry[lang] || entry.uk || entry.en;
  }

  /** Map lesson type to a colour token */
  function typeBadgeColor(type) {
    const colors = {
      dialogue:   { bg: 'rgba(0,140,69,.13)', color: '#008c45' },
      reading:    { bg: 'rgba(69,107,145,.13)', color: '#456b91' },
      grammar:    { bg: 'rgba(217,119,6,.13)', color: '#d97706' },
      checkpoint: { bg: 'rgba(205,33,42,.13)', color: '#cd212a' },
    };
    return colors[type] || colors.dialogue;
  }

  // ── Sidebar ───────────────────────────────────────────────────────────

  function renderSidebar(currentLesson, allLessons, lang) {
    const sbUnit = document.getElementById('sbUnitLessons');
    const sbCourse = document.getElementById('sbCourseLabel');
    if (!sbUnit) return;

    // Filter lessons belonging to the same unit
    const unitLessons = allLessons
      .filter(l => l.unitId === currentLesson.unitId)
      .sort((a, b) => (a.lessonNum || 0) - (b.lessonNum || 0));

    // Course label
    if (sbCourse) {
      const activeCourse = (typeof window.getCourse === 'function' ? window.getCourse(currentLesson.courseId || getCurrentCourseId()) : null) || window.LS_COURSES?.italian;
      sbCourse.textContent = tr(activeCourse?.subtitle || activeCourse?.title, 'Курс · Основи', lang);
    }

    const sbAllCourses = document.getElementById('sbAllCoursesText');
    if (sbAllCourses) {
      sbAllCourses.textContent = lang === 'en' ? 'All learning paths' : (lang === 'pl' ? 'Wszystkie działy kursu' : 'Всі розділи курсу');
    }
    const sbToggle = document.getElementById('sbToggleBtn');
    if (sbToggle) {
      sbToggle.setAttribute('aria-label', lang === 'en' ? 'Table of contents' : (lang === 'pl' ? 'Spis treści' : 'Зміст розділу'));
    }
    const sidebarEl = document.getElementById('sidebar');
    if (sidebarEl) {
      sidebarEl.setAttribute('aria-label', lang === 'en' ? 'Lesson contents' : (lang === 'pl' ? 'Spis treści lekcji' : 'Зміст уроку'));
    }

    const playIcon = `<svg class="ls-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>`;
    const checkIcon = `<svg class="ls-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;

    const lessonPrefix = lang === 'en' ? 'Lesson' : (lang === 'pl' ? 'Lekcja' : 'Урок');

    let html = `<div class="sb-unit">`;
    html += `<div class="sb-unit-title">${tr(currentLesson.unitTitle, 'Розділ', lang)}</div>`;

    unitLessons.forEach(lesson => {
      const isActive   = lesson.id === currentLesson.id;
      const isDone     = isCompleted(lesson.id);
      const classes    = ['sb-lesson', isActive ? 'active' : '', !isActive && !isDone ? 'sb-unit-dim' : ''].filter(Boolean).join(' ');
      const href       = lessonHref(lesson.id);
      const icon       = isActive ? playIcon : (isDone ? checkIcon : '<span style="font-size:.8rem;">○</span>');
      const lessonNum  = lesson.lessonNum || '?';
      const lessonTitle = tr(lesson.title, `${lessonPrefix} ${lessonNum}`, lang);

      html += `<a href="${href}" class="${classes}" aria-current="${isActive ? 'page' : 'false'}">
        <span class="ic">${icon}</span>
        <span>${lessonPrefix} ${lessonNum} · ${lessonTitle}</span>
      </a>`;
    });

    html += `</div>`;

    // Other locked units (dim, heading only)
    const otherUnitIds = [...new Set(
      allLessons
        .filter(l => l.unitId !== currentLesson.unitId)
        .map(l => l.unitId)
    )];

    otherUnitIds.forEach(uid => {
      const sampleLesson = allLessons.find(l => l.unitId === uid);
      if (!sampleLesson) return;
      html += `<div class="sb-unit sb-unit-dim">
        <div class="sb-unit-title">${tr(sampleLesson.unitTitle, uid, lang)}</div>
      </div>`;
    });

    sbUnit.innerHTML = html;
  }

  // ── Hero header ───────────────────────────────────────────────────────

  function renderHero(lesson, lang) {
    const labelEl       = document.getElementById('heroLabel');
    const titleEl       = document.getElementById('heroTitle');
    const descEl        = document.getElementById('heroDescription');
    const metaEl        = document.getElementById('heroMeta');
    const crumbUnit     = document.getElementById('crumbUnit');
    const crumbLesson   = document.getElementById('crumbLesson');

    const unitTitle   = tr(lesson.unitTitle, '', lang);
    const lessonTitle = tr(lesson.title, '', lang);
    const lessonNum   = lesson.lessonNum || '';
    const desc        = tr(lesson.description, '', lang);
    const lessonPrefix = lang === 'en' ? 'Lesson' : (lang === 'pl' ? 'Lekcja' : 'Урок');

    if (labelEl)    labelEl.textContent  = `${unitTitle} · ${lessonPrefix} ${lessonNum}`;
    if (titleEl)    titleEl.textContent  = lessonTitle + (lesson.subtitle ? ` — ${tr(lesson.subtitle, '', lang)}` : '');
    if (descEl)     descEl.textContent   = desc;
    if (crumbUnit)  crumbUnit.textContent = unitTitle;
    if (crumbLesson) crumbLesson.textContent = `${lessonPrefix} ${lessonNum} · ${lessonTitle}`;

    // Meta chips: type badge + duration + XP
    if (metaEl) {
      const { bg, color } = typeBadgeColor(lesson.type);
      const badge = typeBadge(lesson.type, lang);
      const duration = lesson.duration || '';
      const xp = lesson.xpReward ? `+${lesson.xpReward} XP` : '';

      metaEl.innerHTML = `
        <div style="
          display:inline-flex;align-items:center;gap:0.4rem;
          background:${bg};color:${color};
          font-size:0.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
          padding:.3rem .75rem;border-radius:999px;
        ">${badge}</div>
        ${duration ? `<div style="font-size:0.8rem;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:.3rem;">
          <svg class="ls-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${duration}
        </div>` : ''}
        ${xp ? `<div style="font-size:0.8rem;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:.3rem;">
          <svg class="ls-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><path d="M12 3.5l2.6 5.3 5.9.8-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/></svg>
          ${xp}
        </div>` : ''}
      `;
    }

    // Update page title & meta description
    document.title = `${lessonTitle} · ${lessonPrefix} ${lessonNum} — LanguageStudio`;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', desc || document.title);
    document.documentElement.lang = lang;
  }

  // ── Navigation buttons ────────────────────────────────────────────────

  function renderNavButtons(lesson, lang) {
    const prevHref = lesson.prevLessonId ? lessonHref(lesson.prevLessonId) : null;
    const nextHref = lesson.nextLessonId ? lessonHref(lesson.nextLessonId) : null;

    const prevText = lang === 'en' ? '← Previous lesson' : (lang === 'pl' ? '← Poprzednia lekcja' : '← Попередній урок');
    const nextText = lang === 'en' ? 'Next lesson →' : (lang === 'pl' ? 'Następna lekcja →' : 'Наступний урок →');

    // Top bar buttons
    const topPrev = document.getElementById('btnPrevLesson');
    const topNext = document.getElementById('btnNextLesson');
    if (topPrev) {
      topPrev.href = prevHref || 'path.html';
      topPrev.textContent = prevHref ? prevText : (lang === 'en' ? '← Back' : (lang === 'pl' ? '← Wstecz' : '← Назад'));
      topPrev.setAttribute('aria-label', prevHref ? prevText : (lang === 'en' ? 'Back to learning paths' : (lang === 'pl' ? 'Powrót do ścieżek nauki' : 'Назад до розділів')));
    }
    if (topNext) {
      topNext.href = nextHref || 'path.html';
      topNext.textContent = nextHref ? nextText : (lang === 'en' ? 'All lessons →' : (lang === 'pl' ? 'Wszystkie lekcje →' : 'Всі уроки →'));
      topNext.setAttribute('aria-label', nextHref ? nextText : (lang === 'en' ? 'View all lessons' : (lang === 'pl' ? 'Zobacz wszystkie lekcje' : 'Переглянути всі уроки')));
    }

    // Bottom nav buttons
    const botPrev = document.getElementById('btnPrevLessonBottom');
    const botNext = document.getElementById('btnNextLessonBottom');
    if (botPrev) {
      if (prevHref) {
        botPrev.href = prevHref;
        botPrev.textContent = prevText;
        botPrev.style.display = '';
      } else {
        botPrev.style.display = 'none';
      }
    }
    if (botNext) {
      if (nextHref) {
        botNext.href = nextHref;
        botNext.textContent = nextText;
        botNext.style.display = '';
      } else {
        botNext.style.display = 'none';
      }
    }
  }

  // ── Not-found / error state ───────────────────────────────────────────

  function showNotFound(requestedId) {
    const lang = typeof window.getSourceLanguage === 'function' ? window.getSourceLanguage() : 'uk';
    const titleEl = document.getElementById('heroTitle');
    const descEl  = document.getElementById('heroDescription');
    const body    = document.getElementById('lessonBody');

    document.title = lang === 'en' ? 'Lesson not found — LanguageStudio' : (lang === 'pl' ? 'Nie znaleziono lekcji — LanguageStudio' : 'Урок не знайдено — LanguageStudio');

    if (titleEl) titleEl.textContent = lang === 'en' ? 'Lesson not found' : (lang === 'pl' ? 'Nie znaleziono lekcji' : 'Урок не знайдено');
    if (descEl) descEl.textContent = requestedId
      ? (lang === 'en' ? `No lesson was found with id: "${requestedId}".` : (lang === 'pl' ? `Nie znaleziono lekcji o identyfikatorze: „${requestedId}”.` : `Урок з ідентифікатором «${requestedId}» не знайдено.`))
      : (lang === 'en' ? 'No lesson id was specified in the URL.' : (lang === 'pl' ? 'Nie podano identyfikatora lekcji w adresie URL.' : 'Ідентифікатор уроку не вказано в URL.'));

    if (body) body.innerHTML = `
      <div style="padding:2rem;text-align:center;">
        <p style="font-size:1rem;color:var(--ink-soft);margin-bottom:1.5rem;">
          ${lang === 'en'
            ? 'Try selecting a lesson from the sidebar or return to the learning paths page.'
            : (lang === 'pl'
              ? 'Wybierz lekcję z menu bocznego lub wróć do strony ścieżek nauki.'
              : 'Оберіть урок зі списку або поверніться на сторінку навчальних розділів.')}
        </p>
        <a href="path.html" class="btn-primary">
          ${lang === 'en' ? '📚 All learning paths' : (lang === 'pl' ? '📚 Wszystkie ścieżki nauki' : '📚 Всі розділи навчання')}
        </a>
      </div>
    `;
  }

  // ── Mobile sidebar toggle ─────────────────────────────────────────────

  function initSidebarToggle() {
    const btn     = document.getElementById('sbToggleBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sbOverlay');

    function openSidebar() {
      sidebar?.classList.add('open');
      overlay?.classList.add('open');
      btn?.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      sidebar?.classList.remove('open');
      overlay?.classList.remove('open');
      btn?.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    btn?.addEventListener('click', openSidebar);
    overlay?.addEventListener('click', closeSidebar);

    // Close sidebar when a lesson link inside it is clicked (mobile)
    sidebar?.addEventListener('click', (e) => {
      if (e.target.closest('a.sb-lesson')) closeSidebar();
    });
  }

  function getCurrentCourseId() {
    const params = new URLSearchParams(window.location.search);
    const queryCourse = params.get('course');
    if (queryCourse && window.LS_COURSES && window.LS_COURSES[queryCourse]) return queryCourse;
    const savedCourse = localStorage.getItem('ls_target_course');
    if (savedCourse && window.LS_COURSES && window.LS_COURSES[savedCourse]) return savedCourse;
    return 'italian';
  }

  // ── Full page render ──────────────────────────────────────────────────

  function initLessonPage() {
    // 1. Parse course & lesson id from ?course= & ?id= query params or #hash
    const params    = new URLSearchParams(window.location.search);
    const courseId  = getCurrentCourseId();
    let lessonId    = params.get('id') || window.location.hash.replace(/^#/, '');

    // 2. Resolve language
    const lang = typeof window.getSourceLanguage === 'function' ? window.getSourceLanguage() : 'uk';

    // 3. Guard: LS_LESSONS or LS_COURSES must be available
    if (typeof window.LS_LESSONS === 'undefined' && typeof window.LS_COURSES === 'undefined') {
      showNotFound(lessonId);
      return;
    }

    const activeCourse = (typeof window.getCourse === 'function' ? window.getCourse(courseId) : window.LS_COURSES?.[courseId]) || window.LS_COURSES?.italian;
    const courseLessons = activeCourse?.lessons || window.LS_LESSONS || {};

    // 4. Default to first lesson of active course if no id given
    if (!lessonId) {
      lessonId = activeCourse?.defaultLessonId || Object.keys(courseLessons).find(k => k !== 'get' && k !== 'getByUnit' && k !== 'getAll' && k !== 't');
    }

    // 5. Look up lesson object in active course or registry
    const lesson = (courseLessons && courseLessons[lessonId]) || (typeof window.getCourseLessonById === 'function' ? window.getCourseLessonById(lessonId, courseId) : window.LS_LESSONS?.[lessonId]);

    if (!lesson || typeof lesson !== 'object' || Array.isArray(lesson)) {
      showNotFound(lessonId);
      return;
    }

    // 6. Collect all known lessons for active course sidebar
    const allLessons = Object.values(courseLessons).filter(v => v && typeof v === 'object' && v.id);

    // 7. Render sidebar
    renderSidebar(lesson, allLessons, lang);

    // 8. Render hero header
    renderHero(lesson, lang);

    // 9. Render navigation buttons
    renderNavButtons(lesson, lang);

    // 10. Mount engine: renders all section blocks into #lessonBody
    if (typeof window.LessonEngine !== 'undefined') {
      window.LessonEngine.renderLesson(lesson, document.getElementById('lessonBody'));
    } else {
      document.getElementById('lessonBody').innerHTML =
        '<p style="padding:2rem;color:var(--ink-soft);">Движок уроку не завантажено. Перевірте підключення lesson-engine.js.</p>';
    }

    // 11. Update document language
    document.documentElement.lang = lang;
  }

  // ── Language & Course change reactive rerender ───────────────────────

  function rerenderAll() {
    const params   = new URLSearchParams(window.location.search);
    const courseId = getCurrentCourseId();
    const activeCourse = (typeof window.getCourse === 'function' ? window.getCourse(courseId) : window.LS_COURSES?.[courseId]) || window.LS_COURSES?.italian;
    const courseLessons = activeCourse?.lessons || window.LS_LESSONS || {};
    let lessonId = params.get('id') || window.location.hash.replace(/^#/, '');
    if (!lessonId) lessonId = activeCourse?.defaultLessonId || Object.keys(courseLessons)[0];

    const lesson = (courseLessons && courseLessons[lessonId]) || (typeof window.getCourseLessonById === 'function' ? window.getCourseLessonById(lessonId, courseId) : window.LS_LESSONS?.[lessonId]);
    if (!lesson) return;

    const lang = typeof window.getSourceLanguage === 'function' ? window.getSourceLanguage() : 'uk';
    const allLessons = Object.values(courseLessons).filter(v => v && typeof v === 'object' && v.id);

    renderSidebar(lesson, allLessons, lang);
    renderHero(lesson, lang);
    renderNavButtons(lesson, lang);
    if (typeof window.applySourceLanguageSettings === 'function') {
      window.applySourceLanguageSettings();
    }
    // Engine sections re-render handled by LessonEngine.rerenderCurrentLesson()
    // triggered automatically via 'sourceLanguageChanged' event
  }

  window.addEventListener('sourceLanguageChanged', rerenderAll);
  window.addEventListener('courseChanged', (e) => {
    const newCourse = e.detail?.courseId;
    const course = window.LS_COURSES && window.LS_COURSES[newCourse];
    const defaultId = course?.defaultLessonId || Object.keys(course?.lessons || {})[0];
    if (defaultId) {
      window.location.href = `lesson.html?course=${encodeURIComponent(newCourse)}&id=${encodeURIComponent(defaultId)}`;
    } else {
      rerenderAll();
    }
  });
  window.addEventListener('lessonCompleted', () => {
    // Refresh sidebar check marks when a lesson is marked completed
    const params = new URLSearchParams(window.location.search);
    const lessonId = params.get('id') || window.location.hash.replace(/^#/, '');
    if (!lessonId || !window.LS_LESSONS) return;
    const lesson = window.LS_LESSONS[lessonId];
    if (!lesson) return;
    const lang = typeof window.getSourceLanguage === 'function' ? window.getSourceLanguage() : 'uk';
    const allLessons = typeof window.getAllLessons === 'function'
      ? window.getAllLessons()
      : Object.values(window.LS_LESSONS).filter(v => v && typeof v === 'object' && v.id);
    renderSidebar(lesson, allLessons, lang);
  });

  // ── Bootstrap ─────────────────────────────────────────────────────────

  initSidebarToggle();

  // Wait for DOM + components
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLessonPage);
  } else {
    initLessonPage();
  }

  // Also hook after components (navbar) are mounted for any cross-references
  window.addEventListener('componentsLoaded', () => {
    if (typeof window.applySourceLanguageSettings === 'function') {
      window.applySourceLanguageSettings();
    }
  });

})();
</script>

<!-- ═══════════ BOTTOM FOOTER COMPONENT ═══════════ -->
<div data-component="footer"></div>

</body>
</html>
