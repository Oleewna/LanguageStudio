<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- SEO: title and description updated dynamically by JS -->
  <title>Урок — LanguageStudio</title>
  <meta name="description" content="Інтерактивний урок італійської мови на платформі LanguageStudio. Діалоги, читання, граматика та тести." />
  <meta name="robots" content="index, follow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" /></noscript>

  <!-- Theme (must be first to prevent FOUC) -->
  <script src="../js/theme.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/lesson.css" />
  <link rel="stylesheet" href="../css/studio.css" />
</head>
<body class="lesson-app-page">
  <main class="lesson-shell">
    <header class="lesson-top">
      <a class="close-button" href="path.html" aria-label="Повернутися до навчального шляху" title="Повернутися до навчального шляху">×</a>
      <div class="progress-track lesson-top-progress" id="lesson-step-progress" role="progressbar" aria-label="Прогрес уроку" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
        <span class="progress-fill" id="lesson-step-progress-fill"></span>
      </div>
      <span class="lesson-step-progress-label" id="lesson-step-progress-label" aria-live="polite"></span>
      <button type="button" class="btn-ghost lesson-rules-button" id="btnLessonRules" data-no-translate aria-label="Довідник правил заблоковано" title="Довідник правил стане доступним після завершення уроку" disabled hidden>
        <span data-icon="article" aria-hidden="true"></span><span id="btnLessonRulesLabel">Правила</span>
      </button>
    </header>

    <section class="question-content lesson-question-content" id="lessonMain" aria-live="polite">
      <div class="lesson-intro" id="lessonHero">
        <p class="eyebrow" id="heroLabel"></p>
        <h1 id="heroTitle">Завантаження уроку…</h1>
        <p id="heroDescription"></p>
        <div class="hero-meta" id="heroMeta"></div>
      </div>

      <nav class="lesson-index" id="lessonIndex" aria-label="Зміст уроку" hidden>
        <h2 class="lesson-index-title" id="lessonIndexTitle">У цьому уроці</h2>
        <ol class="lesson-index-list" id="lessonIndexList"></ol>
      </nav>

      <div id="lessonBody"></div>

      <nav class="lesson-bottom-nav" id="lessonBottomNav" aria-label="Навігація між уроками">
        <a href="#" class="btn-ghost" id="btnPrevLessonBottom"><span data-icon="arrow-left"></span> Попередній урок</a>
        <a href="#" class="btn-primary" id="btnNextLessonBottom">Наступний урок <span data-icon="arrow-right"></span></a>
      </nav>
    </section>

    <footer class="lesson-footer">
      <div class="lesson-footer-inner">
        <a class="lesson-exit-link" href="path.html">LanguageStudio <span aria-hidden="true">·</span> Вийти з уроку</a>
      </div>
    </footer>
  </main>

<!-- ═══════════ SCRIPTS ═══════════ -->
<script defer src="../js/icons.js"></script>
<script defer src="../js/components.js"></script>
<script defer src="../js/course.js"></script>
<script defer src="../js/storage.js"></script>
<script defer src="../js/progress-store.js"></script>
<script defer src="../js/progress.js"></script>
<script defer src="../js/layout.js"></script>
<script defer src="../js/app.js"></script>
<script defer src="../js/lesson-engine.js"></script>
<script defer src="../js/data/lessons.js"></script>
<script defer src="../js/lesson.js"></script>

<!-- ═══════════ BOTTOM FOOTER COMPONENT ═══════════ -->
<div data-component="footer"></div>

<!-- ═══════════ PROFILE MODAL COMPONENT ═══════════ -->
<div data-component="profile-modal"></div>

</body>
</html>
