<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- SEO: title and description updated dynamically by JS -->
  <title>Урок — LanguageStudio</title>
  <meta name="description" content="Інтерактивний урок італійської мови на платформі LanguageStudio. Діалоги, читання, граматика та тести." />
  <meta name="robots" content="index, follow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Theme (must be first to prevent FOUC) -->
  <script src="../js/theme.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/lesson.css" />
</head>
<body>

<!-- ═══════════ NAVBAR COMPONENT ═══════════ -->
<div data-component="navbar"></div>

<!-- ═══════════ LESSON LAYOUT: SIDEBAR + CONTENT ═══════════ -->
<div class="lesson-layout-wrapper">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sbOverlay"></div>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar" aria-label="Зміст уроку">
    <div class="sb-course" id="sbCourseLabel">Курс італійської · Основи</div>
    <div id="sbUnitLessons">
      <!-- Dynamically populated by renderSidebar() -->
    </div>
    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border);">
      <a href="path.html" id="sbAllCoursesLink" style="color:var(--ink-soft);text-decoration:none;font-size:0.82rem;display:flex;align-items:center;gap:0.5rem;">
        <span data-icon="paths"></span>
        <span id="sbAllCoursesText">Всі розділи курсу</span>
      </a>
    </div>
  </aside>

  <!-- ── Main content area ── -->
  <div class="lesson-main">

    <!-- Lesson top bar: breadcrumb + nav actions -->
    <div class="lesson-topbar">
      <div style="display:flex;align-items:center;gap:0.6rem;">
        <!-- Mobile sidebar toggle -->
        <button
          class="sb-toggle-btn"
          id="sbToggleBtn"
          type="button"
          aria-label="Зміст розділу"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          <span data-icon="paths"></span>
        </button>
        <!-- Breadcrumb -->
        <div class="crumb" id="lessonBreadcrumb" aria-label="Навігація">
          <span id="crumbUnit">Основи спілкування</span>
          <span data-icon="chevron-right" aria-hidden="true"></span>
          <b id="crumbLesson">Урок</b>
        </div>
      </div>
      <div class="lesson-topbar-actions">
        <a href="#" class="btn-ghost" id="btnPrevLesson" data-no-translate aria-label="Попередній урок"><span data-icon="arrow-left"></span> Назад</a>
        <button type="button" class="btn-ghost lesson-rules-button" id="btnLessonRules" data-no-translate aria-label="Довідник правил заблоковано" title="Довідник правил стане доступним після завершення уроку" disabled hidden><span data-icon="article" aria-hidden="true"></span><span id="btnLessonRulesLabel">Правила</span></button>
        <a href="#" class="btn-primary" id="btnNextLesson" data-no-translate aria-label="Наступний урок">Далі <span data-icon="arrow-right"></span></a>
      </div>
    </div>

    <!-- ── Lesson content: hero + engine body ── -->
    <main class="content" id="lessonMain" aria-live="polite">

      <!-- Hero header (populated dynamically) -->
      <div class="hero" id="lessonHero">
        <div class="hero-copy">
          <div class="hero-label" id="heroLabel"></div>
          <h1 id="heroTitle">Завантаження уроку…</h1>
          <p id="heroDescription"></p>
        </div>
        <div class="hero-meta" id="heroMeta" style="display:flex;flex-direction:column;align-items:flex-end;gap:0.65rem;flex-shrink:0;">
          <!-- Lesson type badge + duration chip rendered by JS -->
        </div>
      </div>

      <!-- Engine-rendered lesson sections mount here -->
      <div id="lessonBody">
        <!-- LessonEngine.renderLesson() injects all section blocks here -->
      </div>

      <!-- Bottom navigation -->
      <nav class="lesson-bottom-nav" id="lessonBottomNav" aria-label="Навігація між уроками">
        <a href="#" class="btn-ghost" id="btnPrevLessonBottom" style="display:none;"><span data-icon="arrow-left"></span> Попередній урок</a>
        <a href="#" class="btn-primary" id="btnNextLessonBottom" style="display:none;">Наступний урок <span data-icon="arrow-right"></span></a>
      </nav>

    </main>
  </div><!-- /.lesson-main -->
</div><!-- /.lesson-layout-wrapper -->

<!-- ═══════════ SCRIPTS ═══════════ -->
<script src="../js/icons.js"></script>
<script src="../js/components.js"></script>
<script src="../js/course.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lesson-engine.js"></script>
<script src="../js/data/lessons.js"></script>
<script src="../js/lesson.js"></script>

<!-- ═══════════ BOTTOM FOOTER COMPONENT ═══════════ -->
<div data-component="footer"></div>

<!-- ═══════════ PROFILE MODAL COMPONENT ═══════════ -->
<div data-component="profile-modal"></div>

</body>
</html>
