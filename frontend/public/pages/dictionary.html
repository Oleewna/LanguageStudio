<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg" />
<title>My dictionary — LanguageStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/dictionary.css">
<link rel="stylesheet" href="../css/studio.css">

</head>
<body>

<!-- ═══════════ NAVBAR COMPONENT ═══════════ -->
<div data-component="navbar"></div>


<!-- ═══════════ HERO ═══════════ -->
<section class="page-hero">
  <div class="page-hero-inner">
    <div class="page-hero-label">Слова за темами й ситуаціями</div>
    <h1>Власний словник</h1>
    <p>Знаходьте слова за темою чи ситуацією, зберігайте нову лексику з уроків і власного життя та тренуйте її у флешкартках.</p>
  </div>
</section>

<!-- ═══════════ MAIN CONTENT ═══════════ -->
<main class="page-container">

  <div class="dict-toolbar">
    <div class="search-box">
      <span data-icon="search"></span>
      <input type="text" id="dictSearch" class="search-input" placeholder="Пошук слова чи перекладу..." data-external-handler-dictionary-12="" />
    </div>

    <button type="button" class="filters-toggle-btn dict-filters-toggle" aria-expanded="false" data-filter-toggle="dictionary">
      <span class="filters-toggle-icon"><span data-icon="filter"></span></span>
      <span>Filters</span>
    </button>

    <div class="dict-filters-panel hidden" id="dictionaryFiltersPanel">
      <div class="dict-filters">
        <select id="filterCategory" class="filter-select" data-external-handler-dictionary-13="">
          <option value="">Усі теми й ситуації</option>
        </select>
        <select id="filterLesson" class="filter-select" data-external-handler-dictionary-14="">
          <option value="">Усі уроки</option>
        </select>
        <select id="filterType" class="filter-select" data-external-handler-dictionary-15="">
          <option value="">Усі типи</option>
        </select>
      </div>
    </div>

    <button class="btn-primary" data-external-handler-dictionary-16=""><span data-icon="add"></span> Додати нове слово</button>
  </div>

  <div class="dict-grid" id="dictGrid"></div>

</main>

<!-- Modal: Add Custom Word -->
<div class="modal-backdrop" id="addModal" data-external-handler-dictionary-17="">
  <div class="modal-dialog">
    <div id="external-style-dictionary-1">
      <h3 id="external-style-dictionary-2"><span data-icon="add"></span> Нове слово</h3>
      <button type="button" aria-label="Закрити" data-external-handler-dictionary-18="" id="external-style-dictionary-3"><span data-icon="close"></span></button>
    </div>
    <form id="addWordForm" data-external-handler-dictionary-19="">
      <div class="form-group">
        <label class="form-label">Search the shared vocabulary catalog</label>
        <input type="search" id="catalogSearchInput" class="form-control" placeholder="Type a word or phrase from the course database…" autocomplete="off" />
      </div>
      <div id="catalogSearchResults" class="catalog-search-results">
        <div class="catalog-search-empty">Type a word or phrase to search the course catalog.</div>
      </div>
      <div id="external-style-dictionary-4">
        <button type="button" class="btn-ghost" data-external-handler-dictionary-20="">Cancel</button>
        <button type="submit" class="btn-primary">Search</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══════════ FOOTER COMPONENT ═══════════ -->
<div data-component="footer"></div>

<!-- ═══════════ PROFILE MODAL COMPONENT ═══════════ -->
<div data-component="profile-modal"></div>

<script defer src="../js/icons.js"></script>
<script defer src="../js/components.js"></script>
<script defer src="../js/course.js"></script>
<script defer src="../js/storage.js"></script>
<script defer src="../js/progress-store.js"></script>
<script defer src="../js/progress.js"></script>
<script defer src="../js/user-vocab.js"></script>
<script defer src="../js/layout.js"></script>
<script defer src="../js/app.js"></script>
<script defer src="../js/dictionary.js"></script>
</body>
</html>
