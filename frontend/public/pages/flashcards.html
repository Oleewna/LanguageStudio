<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg" />
<title>Флешкартки — LanguageStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/flashcards.css">
<link rel="stylesheet" href="../css/studio.css">

</head>
<body>

<!-- ═══════════ NAVBAR COMPONENT ═══════════ -->
<div data-component="navbar"></div>

<!-- ═══════════ HERO ═══════════ -->
<section class="page-hero">
  <div class="page-hero-inner">
    <div class="page-hero-label">Словниковий тренажер</div>
    <h1>Флешкартки</h1>
    <p>Фільтруйте слова за напрямком навчання чи тематикою. Перевертайте картку та тренуйте пам'ять.</p>
  </div>
</section>

<!-- ═══════════ MAIN CONTENT ═══════════ -->
<main class="page-container">

  <div class="fc-wrapper">

    <!-- Filter panel -->
    <div class="filter-panel">
      <div class="filter-grid">
        
        <!-- Filter by Track -->
        <div class="filter-group">
          <label class="filter-label" for="filterTrack"><span data-icon="directions"></span> Напрямок</label>
          <select id="filterTrack" class="filter-select" data-external-handler-flashcards-12="">
            <option value="all" selected>Усі напрямки</option>
          </select>
        </div>

      </div>

      <!-- Filter by Topic / Thematic chips -->
      <div class="topic-chips"></div>
    </div>

    <!-- 3D Card Stage -->
    <div class="fc-stage" data-external-handler-flashcards-17="" tabindex="0" role="button" aria-label="Flashcard: show translation" aria-pressed="false">
      <div class="fc-inner" id="fcInner">
        
        <!-- Front -->
        <div class="fc-face fc-front">
          <div class="fc-meta-row">
            <span class="fc-tag" id="fcUnitTag"><span data-icon="greeting"></span><span>—</span></span>
            <span class="fc-tag" id="fcTopicTag"><span data-icon="greeting"></span><span>—</span></span>
          </div>
          <div class="fc-word" id="fcWord">Завантаження слів…</div>
          <div class="fc-pronunciation" id="fcPronunciation"></div>
          <div class="fc-hint"><span data-icon="tap"></span> Натисніть, щоб побачити переклад</div>
        </div>

        <!-- Back -->
        <div class="fc-face fc-back">
          <div class="fc-trans" id="fcTrans"></div>
          <div class="fc-example" id="fcExample"></div>
          <div class="fc-hint" id="external-style-flashcards-1"><span data-icon="tap"></span> Натисніть знову для звороту</div>
        </div>

      </div>
    </div>

    <div class="fc-empty-note" id="fcEmptyNote">Для цього курсу чи уроку поки немає слів у базі уроків.</div>

    <!-- Controls -->
    <div class="fc-controls">
      <button class="btn-ghost" data-external-handler-flashcards-18=""><span data-icon="arrow-left"></span> Назад</button>
      <span class="fc-counter-badge" id="fcCounter">0 / 0</span>
      <button class="btn-ghost" data-external-handler-flashcards-19="">Вперед <span data-icon="arrow-right"></span></button>
      <button class="audio-btn" data-external-handler-flashcards-20="" title="Аудіо (візуальний режим)"><span data-icon="audio"></span></button>
      <button class="btn-ghost" data-external-handler-flashcards-21="" title="Перемішати"><span data-icon="shuffle"></span></button>
    </div>
    <div class="fc-review-controls">
      <button type="button" class="btn-ghost" id="fcMarkLearned" aria-pressed="false">Mark as learned</button>
    </div>
    <p class="fc-review-status" id="fcReviewStatus" role="status" aria-live="polite"></p>

  </div>

</main>

<!-- ═══════════ FOOTER COMPONENT ═══════════ -->
<div data-component="footer"></div>

<!-- ═══════════ PROFILE MODAL COMPONENT ═══════════ -->
<div data-component="profile-modal"></div>

<script defer src="../js/icons.js"></script>
<script defer src="../js/components.js"></script>
<script defer src="../js/course.js"></script>
<script defer src="../js/storage.js"></script>
<script defer src="../js/progress-store.js"></script>
<script defer src="../js/progress.js"></script>
<script defer src="../js/user-vocab.js"></script>
<script defer src="../js/layout.js"></script>
<script defer src="../js/app.js"></script>
<script defer src="../js/flashcards.js"></script>
</body>
</html>
