<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg" />
  <title>Choose a language — LanguageStudio</title>
  <meta name="description" content="Choose a LanguageStudio course and switch between learning tracks." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/studio.css" />
</head>
<body>
  <div data-component="navbar"></div>

  <main class="course-page">
    <header class="course-page-header">
      <p class="eyebrow">LanguageStudio</p>
      <h1>Choose a language</h1>
      <p>Switch between course packs while keeping progress isolated by course.</p>
    </header>

    <section id="courseList" class="course-list" aria-live="polite"></section>
  </main>

  <div data-component="footer"></div>
  <div data-component="profile-modal"></div>

  <script defer src="../js/icons.js"></script>
  <script defer src="../js/components.js"></script>
  <script defer src="../js/course.js"></script>
  <script defer src="../js/storage.js"></script>
  <script defer src="../js/progress-store.js"></script>
  <script defer src="../js/progress.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/app.js"></script>
  <script defer src="../js/courses.js"></script>
</body>
</html>
