<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg" />
<title>Learning paths — LanguageStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"></noscript>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/path.css">
<link rel="stylesheet" href="../css/studio.css">

</head>
<body>

<!-- ═══════════ NAVBAR COMPONENT ═══════════ -->
<div data-component="navbar"></div>


<!-- ═══════════ HERO ═══════════ -->
<section class="page-hero">
  <div class="page-hero-inner">
    <div class="page-hero-label" data-i18n="path.heroLabel">Choose your goal</div>
    <h1 data-i18n="path.heroTitle">Learning paths</h1>
    <p data-i18n="path.heroDesc">Each path builds vocabulary and phrases around a real-life situation — from travel to office conversations. Start with the basics, then move into your chosen path.</p>
    <div style="margin-top:1rem;display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
      <button type="button" class="btn-ghost" id="btnDevUnlock" onclick="unlockForTesting()" style="font-size:0.82rem;padding:0.4rem 0.85rem;border:1px dashed var(--accent, #c9a25b);cursor:pointer;background:var(--surface);">
        <span data-icon="sparkles"></span> <span data-i18n="path.devUnlockBtn">Unlock all paths for testing</span>
      </button>
      <span id="devUnlockStatus" style="font-size:0.8rem;color:var(--ink-soft);"></span>
    </div>
  </div>
</section>

<!-- ═══════════ MAIN CONTENT ═══════════ -->
<main class="page-container">

  <div class="path-container" id="pathContainer"></div>

</main>

<!-- ═══════════ FOOTER COMPONENT ═══════════ -->
<div data-component="footer"></div>

<!-- ═══════════ PROFILE MODAL COMPONENT ═══════════ -->
<div data-component="profile-modal"></div>

<script defer src="../js/icons.js"></script>
<script defer src="../js/components.js"></script>
<script defer src="../js/course.js"></script>
<script defer src="../js/storage.js"></script>
<script defer src="../js/progress-store.js"></script>
<script defer src="../js/progress.js"></script>
<script defer src="../js/layout.js"></script>
<script defer src="../js/app.js"></script>
<script defer src="../js/path-assessment.js"></script>
<script defer src="../js/path-progress.js"></script>


<!-- Data-driven category, unit, and lesson rendering.
     Fixed on review: (1) removed a duplicated lock/active badge that had been
     added at the unit-group level — badge state only ever applied at the
     category level in the original page, so it's now only shown per-unit
     when a unit explicitly supplies its own badgeText (used by future
     multi-unit categories); (2) restored lesson-num / lesson-it (description)
     / lesson-time fields for the "Основи спілкування" lessons, which the
     original page rendered but the earlier flat (title, href, status) model
     had dropped; (3) when a category has exactly one unit, the unit-group
     header is skipped entirely (not just auto-opened) so no redundant bar
     appears — matching the original page pixel-for-pixel for all 3 existing
     categories. -->
<script defer src="../js/path-connectors.js"></script>
<script defer src="../js/path.js"></script>
</body>
</html>
