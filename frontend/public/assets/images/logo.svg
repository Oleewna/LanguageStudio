           M 550,203
           A 52,52 0 1,0 550,307
           A 52,52 0 1,0 550,203 Z"
        fill="url(#paletteGrad)"
        filter="url(#cleanShadow)" />
  <g filter="url(#charShadow)" transform="translate(130, 290)">
    <text x="0" y="0" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="140" fill="#0B2545">한</text>
  </g>
  <g filter="url(#charShadow)" transform="translate(225, 520)">
